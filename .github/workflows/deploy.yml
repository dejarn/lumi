name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # → ghcr.io/dejarn/lumi
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Build the images in the cloud (native arm64 runner — free on public repos)
  # and push to GHCR. The Pi never builds: it only pulls (see deploy job).
  build:
    name: Build & push images
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            file: Dockerfile
          - image: bridge
            file: bridge/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: BUILD_TAG=${{ github.ref_name || 'manual' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.ref_name || 'manual' }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Pull the freshly built images on the Pi and (re)start the stack. No build
  # happens here — the Pi only orchestrates containers.
  deploy:
    name: Deploy on Pi
    needs: build
    runs-on: [self-hosted, linux, arm64]
    environment: production
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      HUE_BRIDGE_IP: ${{ secrets.HUE_BRIDGE_IP }}
      HUE_APP_KEY: ${{ secrets.HUE_APP_KEY }}
      MQTT_BRIDGE_PASSWORD: ${{ secrets.MQTT_BRIDGE_PASSWORD }}
      MQTT_Z2M_PASSWORD: ${{ secrets.MQTT_Z2M_PASSWORD }}
      MQTT_NODES_PASSWORD: ${{ secrets.MQTT_NODES_PASSWORD }}
      BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
      # Routing (host/TLS/rate-limit) now lives in the external reverse-proxy's
      # dynamic config on the Pi (file provider), so APP_HOST is gone from here.
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      APP_TAG: ${{ github.ref_name || 'manual' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # mosquitto/passwd is gitignored, so checkout's git clean wipes it on
      # every deploy. Regenerate it from secrets before the stack starts —
      # otherwise Docker creates a directory at the bind-mount path and
      # mosquitto rejects all connections (bridge then fails its healthcheck).
      - name: Generate mosquitto passwd
        run: |
          rm -rf mosquitto/passwd
          printf 'bridge:%s\nz2m:%s\nnodes:%s\n' \
            "$MQTT_BRIDGE_PASSWORD" "$MQTT_Z2M_PASSWORD" "$MQTT_NODES_PASSWORD" \
            > mosquitto/passwd
          docker run --rm -v "$PWD/mosquitto:/work" eclipse-mosquitto:2.0-openssl \
            mosquitto_passwd -U /work/passwd
          chmod 640 mosquitto/passwd

      - name: Pull images
        run: docker compose pull app mqtt-bridge

      - name: Start database
        run: docker compose up -d db --wait

      # Migrations run in the app entrypoint (docker/entrypoint.sh).
      # Option B: two steps so a Zigbee dongle absence never blocks the web deploy.
      # app/mqtt-bridge/db are critical path (--wait); zigbee2mqtt is best-effort.
      - name: Deploy stack
        run: docker compose up -d app --remove-orphans --wait
      - name: Start zigbee2mqtt (best-effort)
        run: docker compose up -d zigbee2mqtt

      - name: Prune old images
        # Keep the two most recent image generations so an emergency rollback
        # (`APP_TAG=<prev> docker compose up -d app`) doesn't require a re-pull.
        # `docker image prune -f` removes only dangling (untagged) images — tagged
        # rollback images are never deleted by this step.
        if: always()
        run: docker image prune -f
