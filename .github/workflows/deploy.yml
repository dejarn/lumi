name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy on Pi
    runs-on: [self-hosted, linux, arm64]
    environment: production
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      HUE_BRIDGE_IP: ${{ secrets.HUE_BRIDGE_IP }}
      HUE_APP_KEY: ${{ secrets.HUE_APP_KEY }}
      MQTT_BRIDGE_PASSWORD: ${{ secrets.MQTT_BRIDGE_PASSWORD }}
      MQTT_Z2M_PASSWORD: ${{ secrets.MQTT_Z2M_PASSWORD }}
      MQTT_NODES_PASSWORD: ${{ secrets.MQTT_NODES_PASSWORD }}
      BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
      APP_HOST: ${{ secrets.APP_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mosquitto/passwd is gitignored, so checkout's git clean wipes it on
      # every deploy. Regenerate it from secrets before the stack starts —
      # otherwise Docker creates a directory at the bind-mount path and
      # mosquitto rejects all connections (bridge then fails its healthcheck).
      - name: Generate mosquitto passwd
        run: |
          rm -rf mosquitto/passwd
          printf 'bridge:%s\nz2m:%s\nnodes:%s\n' \
            "$MQTT_BRIDGE_PASSWORD" "$MQTT_Z2M_PASSWORD" "$MQTT_NODES_PASSWORD" \
            > mosquitto/passwd
          docker run --rm -v "$PWD/mosquitto:/work" eclipse-mosquitto:2.0-openssl \
            mosquitto_passwd -U /work/passwd
          chmod 640 mosquitto/passwd

      - name: Build images
        # Tag built images with the release tag (or "manual" for workflow_dispatch)
        # so that rollback is possible without a rebuild: docker compose up uses the
        # latest tag by default; a previous tag is kept by the selective prune below.
        run: docker compose build --build-arg BUILD_TAG=${{ github.ref_name || 'manual' }}
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"

      - name: Start database
        run: docker compose up -d db --wait

      # Migrations run in the app entrypoint (docker/entrypoint.sh).
      # Option B: two steps so a Zigbee dongle absence never blocks the web deploy.
      # app/mqtt-bridge/db are critical path (--wait); zigbee2mqtt is best-effort.
      - name: Deploy stack
        run: docker compose up -d app --remove-orphans --wait
      - name: Start zigbee2mqtt (best-effort)
        run: docker compose up -d zigbee2mqtt

      - name: Prune old images
        # Keep the two most recent image generations so an emergency rollback
        # (`docker compose up` with the previous tag) doesn't require a rebuild.
        # `docker image prune -f` removes only dangling (untagged) images — tagged
        # rollback images are never deleted by this step.
        if: always()
        run: docker image prune -f
