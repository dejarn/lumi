services:
  db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_reservation: 256m
    mem_limit: 512m
    cpus: "1.0"

  mosquitto:
    image: eclipse-mosquitto:2.0-openssl
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - internal
      # Exposed on the LAN so ESP32 nodes (lumi-firmware) can reach the broker.
      # Auth is mandatory (mosquitto.conf: allow_anonymous false).
      - lan
    ports:
      - "1883:1883"
    mem_limit: 128m

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.42.0
    restart: unless-stopped
    environment:
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      ZIGBEE2MQTT_CONFIG_MQTT_USER: z2m
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_Z2M_PASSWORD}
      ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: zigbee2mqtt
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyACM0
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "false"
    volumes:
      - zigbee2mqtt_data:/app/data
    depends_on:
      - mosquitto
    networks:
      - internal
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    mem_limit: 256m

  mqtt-bridge:
    image: ghcr.io/dejarn/lumi/bridge:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: bridge/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_URL: mqtt://bridge:${MQTT_BRIDGE_PASSWORD}@mosquitto:1883
      HUE_BRIDGE_IP: ${HUE_BRIDGE_IP}
      HUE_APP_KEY: ${HUE_APP_KEY:-}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      BRIDGE_PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - internal
      # Egress-only path to the LAN for the Hue Bridge REST API — no ports are
      # published, so the bridge stays unreachable from outside (rule 5).
      - lan
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m

  app:
    image: ghcr.io/dejarn/lumi/app:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BRIDGE_URL: http://mqtt-bridge:4000
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      mqtt-bridge:
        condition: service_started  # broker down ≠ app down; bridge /health still exposes broker:false
    networks:
      - internal
      # Shared network with the external reverse-proxy stack. Routing, TLS and
      # rate-limiting live entirely in the proxy's own config (not in this repo);
      # the app just publishes no ports and is reached over this network.
      - edge
    mem_reservation: 128m
    mem_limit: 512m
    cpus: "0.5"

networks:
  internal:
    internal: true
  lan: {}
  # Shared with the external reverse-proxy stack; created on the host
  # (`docker network create edge`). Joining only — no proxy config here.
  edge:
    external: true
    name: edge

volumes:
  db_data:
  mosquitto_data:
  zigbee2mqtt_data:
